# Daily vulnerability scan of the published images of the latest release (what installations run).
# New builds are scanned by CI on every push and pull request. Results: Security → Code scanning.
name: Vulnerability scan

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image: [kartei, kartei-relay]
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName --jq '.[0].tagName')
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"; } >> "$GITHUB_OUTPUT"
      - uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6  # v7.4.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.release.outputs.version }}
          fail-build: false
          only-fixed: true
          output-format: sarif
          output-file: scan.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4
        with:
          sarif_file: scan.sarif
          category: release-${{ matrix.image }}
          # filed under the release tag, not main: otherwise pull requests miss these categories on main and code
          # scanning can't tell which alerts they introduce
          ref: refs/tags/${{ steps.release.outputs.tag }}
          sha: ${{ steps.release.outputs.sha }}
