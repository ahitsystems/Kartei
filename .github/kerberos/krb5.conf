# Client side of the Kerberos test (the "browser"); KDC replaced by the CI step / local run
[libdefaults]
    default_realm = KARTEI.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    dns_canonicalize_hostname = false
    rdns = false

[realms]
    KARTEI.TEST = {
        kdc = KDC_HOST
    }
