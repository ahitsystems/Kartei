name: Bug report
description: Something in Kartei doesn't work as described in the manuals
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include real contact data, passwords, tokens or internal host names.
        Security vulnerabilities: please report them privately (see the link on the previous page), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Contacts (search, view, edit)
        - Reviews and proposals
        - Settings / fields
        - Sign-in (local, LDAP, SSO/OIDC, SCIM, two-factor)
        - Outlook / Exchange sync
        - CardDAV / relay
        - Active Directory sync
        - Exports / import
        - REST API
        - Phone view / app (PWA, offline)
        - Email
        - Backup / monitoring / syslog
        - Installation / Docker / upgrade
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kartei version
      description: Shown at the bottom of the user menu, or the image tag, e.g. 0.10.0-beta
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role of the affected user
      options: [Read only, Maintainer, Admin, not relevant]
  - type: input
    id: client
    attributes:
      label: Browser / client
      description: e.g. Chrome 156 on Windows, Outlook app on iOS, phone CardDAV account
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs web`, `docker compose logs exporter` or, for the relay, `docker compose -f compose.relay.yaml logs` (remove personal data).
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real contact data, passwords, tokens or internal host names.
          required: true
